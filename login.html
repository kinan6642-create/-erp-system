{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow-sm" style="width:380px;">
    <div class="card-body p-4">
      <h4 class="text-center mb-1">🏢 نظام إدارة الأعمال</h4>
      <p class="text-center text-muted mb-4">تسجيل الدخول</p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">اسم المستخدم</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">كلمة المرور</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">دخول</button>
      </form>
      <p class="text-muted small mt-3 mb-0 text-center">المستخدم الافتراضي: admin / admin123</p>
    </div>
  </div>
</div>
{% endblock %}
