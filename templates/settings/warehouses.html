{% extends "base.html" %}
{% block page_title %}المستودعات{% endblock %}
{% block content %}
<div class="row g-3">
  <div class="col-md-4">
    <div class="card-box">
      <h6 class="fw-bold">إضافة مستودع</h6>
      <form method="POST">
        <div class="mb-2">
          <select name="branch_id" class="form-select">
            <option value="">بدون فرع</option>
            {% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="mb-2"><input class="form-control" name="name" placeholder="اسم المستودع" required></div>
        <div class="mb-2"><input class="form-control" name="location" placeholder="الموقع"></div>
        <button class="btn btn-primary w-100">إضافة</button>
      </form>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card-box">
      <table class="table">
        <thead><tr><th>#</th><th>الاسم</th><th>الفرع</th><th></th></tr></thead>
        <tbody>
        {% for w in items %}
          <tr><td>{{ w.id }}</td><td>{{ w.name }}</td><td>{{ w.branch_name or '-' }}</td>
          <td><a href="{{ url_for('settings.delete_warehouse', id=w.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('تأكيد الحذف؟')">حذف</a></td></tr>
        {% else %}
          <tr><td colspan="4" class="text-center text-muted">لا توجد مستودعات بعد</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
