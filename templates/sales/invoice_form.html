{% extends "base.html" %}
{% block page_title %}فاتورة بيع جديدة{% endblock %}
{% block content %}
<form method="POST" id="invoiceForm">
<div class="row g-3">
  <div class="col-md-3">
    <div class="card-box">
      <h6 class="fw-bold mb-3">بيانات الفاتورة</h6>
      <div class="mb-2">
        <label class="form-label small">التاريخ</label>
        <input class="form-control" type="date" name="date" value="{{ today }}" required>
      </div>
      <div class="mb-2">
        <label class="form-label small">العميل</label>
        <select class="form-select" name="customer_id">
          <option value="">عميل نقدي (بدون حساب)</option>
          {% for c in customers %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label small">المستودع</label>
        <select class="form-select" name="warehouse_id" required>
          {% for w in warehouses %}
            <option value="{{ w.id }}">{{ w.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label small">نوع الدفع</label>
        <select class="form-select" name="payment_type" required>
          <option value="cash">نقدي</option>
          <option value="credit">آجل</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label small">خصم على الفاتورة</label>
        <input class="form-control" type="number" step="0.01" name="discount" value="0">
      </div>
      <div class="mb-2">
        <label class="form-label small">نسبة الضريبة %</label>
        <input class="form-control" type="number" step="0.01" name="tax_rate" value="0">
      </div>
    </div>
  </div>

  <div class="col-md-9">
    <div class="card-box">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold m-0">الأصناف</h6>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="addRow()"><i class="bi bi-plus"></i> إضافة صنف</button>
      </div>
      <table class="table table-sm" id="itemsTable">
        <thead><tr><th>الصنف</th><th style="width:110px">الكمية</th><th style="width:130px">السعر</th><th style="width:130px">الإجمالي</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="d-flex justify-content-end">
        <table class="table table-sm w-auto">
          <tr><td class="text-muted">الإجمالي الفرعي</td><td class="text-end fw-bold" id="subtotalCell">0.00</td></tr>
          <tr><td class="text-muted">الصافي بعد الخصم والضريبة</td><td class="text-end fw-bold text-primary" id="netCell">0.00</td></tr>
        </table>
      </div>
      <button class="btn btn-primary w-100 mt-2"><i class="bi bi-check-circle"></i> حفظ الفاتورة</button>
    </div>
  </div>
</div>
</form>

<template id="rowTemplate">
  <tr>
    <td>
      <select class="form-select form-select-sm item-select" name="item_id[]" required>
        <option value="">اختر صنف</option>
        {% for it in items %}
          <option value="{{ it.id }}" data-price="{{ it.sale_price }}">{{ it.code }} - {{ it.name }}</option>
        {% endfor %}
      </select>
    </td>
    <td><input class="form-control form-control-sm qty-input" type="number" step="0.01" name="quantity[]" value="1" required></td>
    <td><input class="form-control form-control-sm price-input" type="number" step="0.01" name="price[]" value="0" required></td>
    <td><span class="line-total">0.00</span></td>
    <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove(); recalc();"><i class="bi bi-trash"></i></button></td>
  </tr>
</template>

{% endblock %}
{% block scripts %}
<script>
function addRow(){
  const tpl = document.getElementById('rowTemplate');
  const clone = tpl.content.cloneNode(true);
  document.querySelector('#itemsTable tbody').appendChild(clone);
  bindRow(document.querySelector('#itemsTable tbody tr:last-child'));
  recalc();
}
function bindRow(row){
  const sel = row.querySelector('.item-select');
  const price = row.querySelector('.price-input');
  const qty = row.querySelector('.qty-input');
  sel.addEventListener('change', function(){
    const opt = sel.options[sel.selectedIndex];
    price.value = opt.dataset.price || 0;
    recalc();
  });
  price.addEventListener('input', recalc);
  qty.addEventListener('input', recalc);
}
function recalc(){
  let subtotal = 0;
  document.querySelectorAll('#itemsTable tbody tr').forEach(row=>{
    const qty = parseFloat(row.querySelector('.qty-input').value)||0;
    const price = parseFloat(row.querySelector('.price-input').value)||0;
    const total = qty*price;
    row.querySelector('.line-total').textContent = total.toFixed(2);
    subtotal += total;
  });
  const discount = parseFloat(document.querySelector('[name=discount]').value)||0;
  const taxRate = parseFloat(document.querySelector('[name=tax_rate]').value)||0;
  const net = (subtotal - discount) * (1 + taxRate/100);
  document.getElementById('subtotalCell').textContent = subtotal.toFixed(2);
  document.getElementById('netCell').textContent = net.toFixed(2);
}
document.querySelector('[name=discount]').addEventListener('input', recalc);
document.querySelector('[name=tax_rate]').addEventListener('input', recalc);
addRow();
</script>
{% endblock %}
