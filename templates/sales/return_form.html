{% extends "base.html" %}
{% block page_title %}مرتجع بيع جديد{% endblock %}
{% block content %}
<form method="POST">
<div class="row g-3">
  <div class="col-md-4">
    <div class="card-box">
      <h6 class="fw-bold mb-3">بيانات المرتجع</h6>
      <div class="mb-2">
        <label class="form-label small">التاريخ</label>
        <input class="form-control" type="date" name="date" value="{{ today }}" required>
      </div>
      <div class="mb-2">
        <label class="form-label small">فاتورة البيع</label>
        <select class="form-select" name="invoice_id" id="invoiceSelect" required onchange="loadItems()">
          <option value="">اختر فاتورة</option>
          {% for inv in invoices %}
            <option value="{{ inv.id }}">{{ inv.number }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="alert alert-info small">اختر الفاتورة أولاً ثم حدد الكمية المرتجعة لكل صنف.</div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card-box">
      <h6 class="fw-bold mb-2">أصناف الفاتورة</h6>
      <table class="table table-sm">
        <thead><tr><th>الصنف</th><th>الكمية بالفاتورة</th><th>السعر</th><th style="width:130px">الكمية المرتجعة</th></tr></thead>
        <tbody id="itemsBody">
          <tr><td colspan="4" class="text-center text-muted">لم يتم اختيار فاتورة بعد</td></tr>
        </tbody>
      </table>
      <button class="btn btn-primary w-100 mt-2"><i class="bi bi-check-circle"></i> حفظ المرتجع</button>
    </div>
  </div>
</div>
</form>
{% endblock %}
{% block scripts %}
<script>
async function loadItems(){
  const invId = document.getElementById('invoiceSelect').value;
  const body = document.getElementById('itemsBody');
  body.innerHTML = '';
  if(!invId){ body.innerHTML = '<tr><td colspan="4" class="text-center text-muted">لم يتم اختيار فاتورة بعد</td></tr>'; return; }
  const res = await fetch(`/sales/api/invoice-items/${invId}`);
  const data = await res.json();
  if(data.length === 0){ body.innerHTML = '<tr><td colspan="4" class="text-center text-muted">لا توجد أصناف</td></tr>'; return; }
  data.forEach(it=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${it.name}<input type="hidden" name="item_id[]" value="${it.item_id}"></td>
      <td>${it.quantity}</td>
      <td>${it.price.toFixed(2)}</td>
      <td><input class="form-control form-control-sm" type="number" step="0.01" min="0" max="${it.quantity}" name="quantity[]" value="0"></td>
    `;
    body.appendChild(tr);
  });
}
</script>
{% endblock %}
