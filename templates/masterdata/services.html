{% extends "base.html" %}
{% block page_title %}الخدمات{% endblock %}
{% block content %}
<div class="row g-3">
  <div class="col-md-4">
    <div class="card-box">
      <h6 class="fw-bold">إضافة خدمة</h6>
      <form method="POST">
        <div class="mb-2"><input class="form-control" name="name" placeholder="اسم الخدمة" required></div>
        <div class="mb-2"><input class="form-control" type="number" step="0.01" name="price" placeholder="السعر"></div>
        <button class="btn btn-primary w-100">إضافة</button>
      </form>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card-box">
      <table class="table">
        <thead><tr><th>الاسم</th><th>السعر</th></tr></thead>
        <tbody>
        {% for s in items %}<tr><td>{{ s.name }}</td><td>{{ '%.2f'|format(s.price) }}</td></tr>
        {% else %}<tr><td colspan="2" class="text-center text-muted">لا يوجد</td></tr>{% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
