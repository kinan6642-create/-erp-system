{% extends "base.html" %}
{% block page_title %}مراكز التكلفة{% endblock %}
{% block content %}
<div class="row g-3">
  <div class="col-md-4">
    <div class="card-box">
      <h6 class="fw-bold">إضافة مركز تكلفة</h6>
      <form method="POST">
        <div class="mb-2"><input class="form-control" name="name" placeholder="اسم مركز التكلفة" required></div>
        <button class="btn btn-primary w-100">إضافة</button>
      </form>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card-box">
      <table class="table">
        <thead><tr><th>#</th><th>الاسم</th></tr></thead>
        <tbody>
        {% for c in items %}
          <tr><td>{{ c.id }}</td><td>{{ c.name }}</td></tr>
        {% else %}
          <tr><td colspan="2" class="text-center text-muted">لا توجد مراكز تكلفة بعد</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
