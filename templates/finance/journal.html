{% extends "base.html" %}
{% block page_title %}القيود اليومية{% endblock %}
{% block content %}
<div class="card-box">
  <table class="table table-hover">
    <thead><tr><th>الرقم</th><th>التاريخ</th><th>البيان</th><th>المصدر</th><th></th></tr></thead>
    <tbody>
    {% for e in entries %}
      <tr>
        <td>{{ e.number }}</td><td>{{ e.date }}</td><td>{{ e.description }}</td>
        <td class="small text-muted">{{ e.ref_type or '-' }}</td>
        <td><a href="{{ url_for('finance.journal_view', id=e.id) }}" class="btn btn-sm btn-outline-primary">عرض</a></td>
      </tr>
    {% else %}
      <tr><td colspan="5" class="text-center text-muted">لا توجد قيود بعد</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
